name: ci

# Lint, test, supply-chain audit, and terraform validate. No AWS credentials needed — everything
# here is offline (terraform validate runs with `-backend=false`). Apply runs only on merge to main,
# in deploy.yml, under the OIDC deploy role.
#
# Third-party actions are pinned to a full commit SHA (a mutable tag could be re-pointed at
# malicious code).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --all --check
      # Lint the pure lib (+ its tests) and the AWS Lambda binaries (both bins are feature-gated
      # behind `aws`, so they are skipped without the feature — lint each explicitly).
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --bin bootstrap --features aws -- -D warnings
      - run: cargo clippy --bin watcher --features aws -- -D warnings
      - run: cargo test --all-targets
      # Rust coverage gate (§2.3), mirroring the JS `js` job's ≥80% floor. Measures the pure
      # resolver LOGIC — src/lib.rs (subdomain/URN/render/config decisions) + src/domain.rs
      # (record shape + label/lifecycle rules) + src/watcher.rs (the AWS-free chain-change decision
      # core). EXCLUDED (`--ignore-filename-regex 'src/bin/'`): the feature-gated Lambda
      # entrypoints src/bin/bootstrap.rs + src/bin/watcher.rs — thin AWS/HTTP wiring (DynamoDB
      # GetItem, coinset.org fetch, CloudFront invalidation, lambda_http glue) exercised by deploy,
      # not unit-testable without live AWS; their pure decision logic already lives in the measured
      # lib modules. The run FAILS below 80% line/function/region coverage of that scoped set.
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: rust coverage gate (≥80% lines/functions/regions of the resolver logic)
        run: >-
          cargo llvm-cov
          --ignore-filename-regex 'src/bin/'
          --fail-under-lines 80
          --fail-under-functions 80
          --fail-under-regions 80

  js:
    name: js test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      # Deterministic OFFLINE integrity gate (#2263): recompute each vendored asset's sha256 and
      # assert it matches assets/vendor-manifest.json, so a vendored file (dig-embed.js from hub,
      # dig_client.js/.wasm from dig-client-wasm) can never silently drift/be edited without a
      # provenance update — the staleness that made #2261 a live vuln. Upstream CODE drift is the
      # separate scheduled job .github/workflows/vendor-drift.yml (this stays network-free).
      - name: vendored-asset integrity gate (sha256 vs vendor-manifest.json)
        run: node scripts/check-vendored-assets.mjs
      # No package.json / dependencies: the sw.js orchestration logic (range planner, parallel
      # fan-out, cache-key builders, decrypt-stream assembly, the RPC/GET fetch paths, and the full
      # serveUrn control flow, §205a/§205d/§205e) is tested with Node's built-in test runner + a
      # small in-repo crypto stub (test/stub-dig-client.mjs) — no browser, no wasm build needed. See
      # test/load-sw.mjs for how the REAL assets/sw.js is loaded (with V8 coverage attribution).
      #
      # Coverage is a REQUIRED gate (§2.3): the run FAILS below 80% line/branch/function coverage of
      # the measured source (test/** is excluded so the floor reflects assets/sw.js itself). The
      # only measured file today is assets/sw.js; any future loader JS is measured + held to the
      # same floor automatically.
      - name: js unit tests + coverage gate (≥80% lines/branches/functions)
        run: >-
          node --test
          --experimental-test-coverage
          --test-coverage-exclude='test/**'
          --test-coverage-lines=80
          --test-coverage-branches=80
          --test-coverage-functions=80
          test/sw.test.mjs test/sw-runtime.test.mjs test/dig-embed.test.mjs test/vendor-map.test.mjs

  urn-conformance:
    name: DIG URN parse conformance (both loaders vs the dig-sdk table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/conformance/package-lock.json
      # Separate job (and separate package) because this is the ONE test here that needs a real
      # dependency: the parse contract is read from the INSTALLED @dignetwork/dig-sdk, never from a
      # copy — a copied table drifts silently, which is the failure class it exists to close (#17).
      # The repo root stays a Rust crate with no package.json, so the `js` job stays dependency-free.
      - name: install the conformance table (@dignetwork/dig-sdk)
        working-directory: tests/conformance
        run: npm ci
      - name: assert both URN parsers conform to the ratified table
        working-directory: tests/conformance
        run: npm test

  a11y:
    name: accessibility (axe WCAG 2.2 AA on the served documents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: install a11y test deps
        working-directory: tests/a11y
        run: npm ci
      - name: install chromium (with system deps)
        working-directory: tests/a11y
        run: npx playwright install --with-deps chromium
      # loader.html / error.html are the ONLY two documents src/bin/bootstrap.rs serves to a
      # browser (see tests/a11y/axe.test.mjs) — the four legacy per-status pages are dead code.
      - name: axe — assert 0 WCAG 2.2 AA violations on the served documents
        working-directory: tests/a11y
        run: npm test

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories licenses sources bans

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform -chdir=infra fmt -check -recursive
      # Validate WITHOUT a backend (offline, no AWS creds): checks the config is well-formed.
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
